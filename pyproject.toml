[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoying-knowledge-agent"
version = "0.2.0"
description = "Evidence-grounded enterprise policy agent with auditable tool calls"
requires-python = ">=3.10"
dependencies = ["langgraph==1.2.18"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
