[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoying-knowledge-agent"
version = "0.1.0"
description = "Evidence-grounded enterprise policy agent with auditable tool calls"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
